name: Release

# Publishes a GitHub Release when a version tag is pushed. The release is the
# version-of-record the app's in-app update check polls; users update by
# rebuilding from source (git pull && ./install.sh). No binary is attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app (proves the tag compiles and stamps the version)
        run: APP_VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Create GitHub release (notes only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="$(mktemp)"
          {
            echo "To update: \`git pull && ./install.sh\`"
            echo
          } > "$NOTES_FILE"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE" \
            --generate-notes
